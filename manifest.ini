name = github For NVDA
summary = "github For NVDA"
description = """A powerful NVDA add-on
that brings complete GitHub repository and file management right to your screen reader with absolute speed and convenience.
Manage repositories, browse public repositories, handle files, and more - all through an accessible interface.

login prosses:
1. Press NVDA + Control + G to open the main menu.
2. Click "Set / Edit Personal Access Token"
3. Enter your GitHub Personal Access Token.
4. Use the menu to manage repositories and files.

Getting a Personal Access Token:
1. Go to https://github.com/settings/tokens
2. Click "Generate new token"
3. Select required permissions (repo, read: user)
4. Click "Generate token"
5. Copy and paste it in GitHub For NVDA.

Features:
* Secure GitHub Personal Access Token management
* View and manage your repositories
* Explore public GitHub repositories
* Browse repository files
* Create new repositories
* Real-time GitHub API integration
* Automatic update checking

Requirements:
* NVDA 2024.1 or later
* Internet connection
* GitHub account"""
author = "Mahadeesh"
url = https://github.com/Mahadeesh18/githubForNVDA
version = 1.0
changelog = """Removed built-in updater - NVDA addon store now handles all updates automatically.
Improved stability and performance."""
docFileName = readme.html
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.2
updateChannel = None
