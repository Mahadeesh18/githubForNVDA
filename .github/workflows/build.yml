name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install pytest pyflakes
      - name: Look for mistakes
        # _ and ngettext are the translation functions NVDA installs; core.py re-exports helpers on purpose.
        run: |
          problems=$(PYFLAKES_BUILTINS=_,ngettext python -m pyflakes globalPlugins tools tests | grep -v "imported but unused" || true)
          if [ -n "$problems" ]; then echo "$problems"; exit 1; fi
      - name: Run the tests
        run: python -m pytest -q tests
      - name: Build the add-on and the translation template
        run: |
          python tools/build.py pot
          python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: githubForNVDA
          path: |
            *.nvda-addon
            githubForNVDA.pot
